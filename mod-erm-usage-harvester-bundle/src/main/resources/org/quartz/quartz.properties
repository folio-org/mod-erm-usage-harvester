# Keep jobs and triggers in Hazelcast instead of in memory. All module instances that form one
# Hazelcast cluster share them, so a job (e.g. a provider run) is executed by only one instance.
org.quartz.jobStore.class=com.breakingequity.quarz.store.hazelcast.HazelcastJobStoreDelegate

# Quartz's standard fixed-size pool of worker threads that execute the jobs.
org.quartz.threadPool.class=org.quartz.simpl.SimpleThreadPool

# Number of worker threads per module instance, i.e. how many jobs run at once on it. A provider
# run blocks its thread until it is finished, so this is also the limit for parallel provider runs.
org.quartz.threadPool.threadCount=4

# Name of the scheduler. It is the prefix of the worker thread names, and the Hazelcast job store
# appends it to its map names, so all instances must use the same name to share their jobs.
org.quartz.scheduler.instanceName=HazelcastJobStoreScheduler
